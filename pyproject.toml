[project]
name = "motortwin"
version = "0.1.0"
description = "Physics-based digital twin for a small DC motor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.36.0",
  "plotly>=5.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
